name: 功能建议
description: 提议新的功能、体验改进或现有能力调整
title: "[Feature] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 BloomStreak 提出建议。请优先描述要解决的问题，再说明建议方案和范围。

        请勿提交密码、访问令牌、Cookie、未脱敏截图或真实用户隐私数据。

  - type: textarea
    id: problem
    attributes:
      label: 问题或需求
      description: 当前遇到了什么问题？谁会受到影响？为什么值得解决？
      placeholder: 例如：当习惯较多时，用户难以快速找到今天尚未完成的项目。
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 建议方案
      description: 请描述期望的交互、行为或结果，而不只是实现技术。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代做法、临时解决方式或不做此功能的影响？
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 建议范围
      description: 请明确本建议应包含和不包含的内容，避免范围持续扩大。
      placeholder: |
        包含：
        - ……
        不包含：
        - ……
        对 LocalStorage / Supabase / PWA / 移动端的影响：
    validations:
      required: true

  - type: checkboxes
    id: affected_areas
    attributes:
      label: 可能影响的区域
      description: 可多选；不确定时可选择“尚不确定”。
      options:
        - label: LocalStorage 或本地数据
        - label: Supabase Auth、云同步、数据库或 RLS
        - label: PWA、离线能力或安装体验
        - label: 移动端布局、可访问性或交互
        - label: 尚不确定

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息
      description: 可提供已脱敏的草图、截图、使用场景或参考资料。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有明显重复的建议。
          required: true
        - label: 我确认本 Issue 不包含密码、密钥、访问令牌、Cookie 或未脱敏的个人数据。
          required: true
    validations:
      required: true
